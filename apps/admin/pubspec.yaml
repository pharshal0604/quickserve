name: quickserve_admin
description: QuickServe administrator web portal.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.3
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.1
  cloud_firestore: ^6.0.0
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  shared:
    path: ../../packages/shared
  url_launcher: ^6.3.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  web:
    generate: true
    image_path: "assets/icon.jpg"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
  image_path: "assets/icon.jpg"
