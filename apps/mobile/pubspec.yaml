name: quickserve_mobile
description: QuickServe mobile application.
publish_to: "none"
version: 0.0.1

environment:
  sdk: ^3.13.3
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.1
  cloud_firestore: ^6.0.0
  google_sign_in: ^6.2.1
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  shared:
    path: ../../packages/shared
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
